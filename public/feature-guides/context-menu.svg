<svg width="340" height="240" viewBox="0 0 340 240" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* <![CDATA[ */
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Manrope:wght@200..800&display=swap');
    
    :root {
      /* Sepia Theme */
      --background: #f4ecd8;
      --foreground: #4a3c31;
      --card: #f9f3e5;
      --card-foreground: #4a3c31;
      --popover: #f9f3e5;
      --popover-foreground: #4a3c31;
      --muted: #e8dfca;
      --muted-foreground: #7c6f64;
      --border: #dbcdb0;
      --primary: #4a3c31;
      --font-sans: "Manrope", sans-serif;
      --font-heading: "Fraunces", serif;
    }
    
    text { font-family: var(--font-sans); }
    
    .wrapper-bg { fill: var(--muted); fill-opacity: 0.2; stroke: var(--border); stroke-opacity: 0.6; stroke-width: 1; }
    
    /* Skeleton */
    .skel-dark { fill: var(--foreground); fill-opacity: 0.2; }
    .skel-light { fill: var(--foreground); fill-opacity: 0.1; }
    
    /* Menu */
    .menu-bg { 
      fill: var(--popover); 
      stroke: var(--border); 
      stroke-opacity: 1; 
      stroke-width: 1; 
    }
    .menu-text { color: var(--popover-foreground); fill: var(--popover-foreground); font-size: 14px; font-weight: 400; }
    .menu-shortcut { color: var(--muted-foreground); fill: var(--muted-foreground); font-size: 12px; }
    .menu-divider { stroke: var(--border); stroke-opacity: 1; stroke-width: 1; }
    
    /* Animations */
    .menu-container {
      transform-origin: 70px 25px;
      animation: menuAppear 4s infinite;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
    }
    
    .highlight-bg {
      fill: var(--primary);
      fill-opacity: 0;
      animation: highlightAppear 4s infinite;
    }
    
    .highlight-text {
      color: var(--primary);
      fill: var(--primary); 
      font-size: 14px; 
      font-weight: 500;
    }
    
    .cursor {
      transform-origin: top left;
      animation: moveCursor 4s cubic-bezier(0.2,0.8,0.2,1) infinite;
      filter: drop-shadow(0 4px 4px rgba(74, 60, 49, 0.15));
    }
    
    .ping-1 { fill: var(--primary); animation: ping1 4s ease-out infinite; }
    .ping-2 { fill: var(--primary); animation: ping2 4s ease-out infinite; }
    
    @keyframes menuAppear {
      0% { opacity: 0; transform: scale(0.95); }
      5%, 70% { opacity: 1; transform: scale(1); }
      75%, 100% { opacity: 0; transform: scale(0.95); }
    }
    
    @keyframes highlightAppear {
      0%, 22% { fill-opacity: 0; }
      27.5%, 70% { fill-opacity: 0.2; }
      75%, 100% { fill-opacity: 0; }
    }
    
    @keyframes moveCursor {
      0%, 10% { transform: translate(78px, 33px) scale(1); }
      22.5%, 70% { transform: translate(240px, 149px) scale(0.95); }
      77.5%, 100% { transform: translate(78px, 33px) scale(1); }
    }
    
    @keyframes ping1 {
      0% { opacity: 0; transform: scale(0.2); }
      1% { opacity: 0.4; transform: scale(0.2); }
      15% { opacity: 0; transform: scale(2); }
      100% { opacity: 0; transform: scale(2); }
    }
    
    @keyframes ping2 {
      0%, 21% { opacity: 0; transform: scale(0.2); }
      22% { opacity: 0.4; transform: scale(0.2); }
      35% { opacity: 0; transform: scale(2); }
      100% { opacity: 0; transform: scale(2); }
    }
    /* ]]> */
  </style>

  <!-- Outer container -->
  <rect x="0" y="0" width="340" height="240" rx="16" class="wrapper-bg" />

  <!-- Fake Webpage Background -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="97" height="16" rx="4" class="skel-dark" />
    
    <rect x="0" y="32" width="292" height="8" rx="4" class="skel-light" />
    <rect x="0" y="48" width="243" height="8" rx="4" class="skel-light" />
    <rect x="0" y="64" width="194" height="8" rx="4" class="skel-light" />
    
    <rect x="0" y="88" width="292" height="8" rx="4" class="skel-light" />
    <rect x="0" y="104" width="292" height="8" rx="4" class="skel-light" />
  </g>

  <!-- Right Click Ping (Ping 1) - aligned exactly to initial cursor tip -->
  <g transform="translate(81, 36.5)">
    <circle cx="0" cy="0" r="8" class="ping-1" />
  </g>

  <!-- Context Menu (appears at 70, 25) -->
  <g class="menu-container">
    <rect x="70" y="25" width="200" height="180" rx="8" class="menu-bg" />
    
    <!-- Highlight Background -->
    <rect x="71" y="130" width="198" height="32" class="highlight-bg" />

    <!-- Text content inside menu -->
    <!-- Back -->
    <text x="82" y="46" class="menu-text">Back</text>
    <text x="258" y="46" text-anchor="end" class="menu-shortcut" opacity="0.5">Alt+Left</text>

    <!-- Forward -->
    <g opacity="0.5">
      <text x="82" y="78" class="menu-text">Forward</text>
      <text x="258" y="78" text-anchor="end" class="menu-shortcut">Alt+Right</text>
    </g>

    <!-- Reload -->
    <text x="82" y="110" class="menu-text">Reload</text>
    <text x="258" y="110" text-anchor="end" class="menu-shortcut" opacity="0.5">Ctrl+R</text>

    <!-- Divider 1 -->
    <line x1="71" y1="125.5" x2="269" y2="125.5" class="menu-divider" />

