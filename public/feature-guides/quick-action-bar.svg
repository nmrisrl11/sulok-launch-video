<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" width="340" height="240">
  <style>
    /* <![CDATA[ */
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Manrope:wght@200..800&display=swap');

    :root {
      /* Sepia Theme */
      --background: #f4ecd8;
      --foreground: #4a3c31;
      --card: #f9f3e5;
      --card-foreground: #4a3c31;
      --popover: #f9f3e5;
      --popover-foreground: #4a3c31;
      --muted: #e8dfca;
      --muted-foreground: #7c6f64;
      --border: #dbcdb0;
      --primary: #4a3c31;
      --primary-foreground: #f4ecd8;
      --font-sans: "Manrope", sans-serif;
      --font-heading: "Fraunces", serif;
    }
    
    text { font-family: var(--font-sans); }
    
    .fill-foreground { fill: var(--foreground); color: var(--foreground); }
    .fill-background { fill: var(--background); color: var(--background); }
    
    /* Layout */
    .wrapper-bg { fill: var(--muted); fill-opacity: 0.2; stroke: var(--border); stroke-opacity: 0.6; stroke-width: 1; }
    .skel-dark { fill: var(--foreground); fill-opacity: 0.2; }
    .skel-light { fill: var(--foreground); fill-opacity: 0.1; }
    .skel-divider { stroke: var(--border); stroke-opacity: 0.5; stroke-width: 1; }
    
    /* FAB */
    .fab-bg {
      fill: var(--card);
      fill-opacity: 0.9;
      stroke: var(--border);
      stroke-width: 1;
      filter: drop-shadow(0 9px 6px rgba(0, 0, 0, 0.2));
      animation: fabRect 4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }
    .mascot-bg { fill: var(--muted); fill-opacity: 0.3; }
    .fab-text { font-size: 14px; fill: var(--muted-foreground); color: var(--muted-foreground); }
    .icon-muted { fill: none; stroke: var(--muted-foreground); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    
    /* Cursor */
    .icon-cursor { fill: var(--foreground); stroke: var(--foreground); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .ping-circle { fill: var(--primary); animation: pingAnim 4s ease-out infinite; }
    
    /* Animations */
    .bg-fade { animation: bgFade 4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    .fab-inner { animation: fabInnerPos 4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    .expanded-content { animation: contentFade 4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    .mascot-default { transform-origin: 18px 18px; animation: mascotDefault 4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    .mascot-curious { transform-origin: 18px 18px; animation: mascotCurious 4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    .cursor-anim { transform-origin: top left; animation: moveCursor 4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; filter: drop-shadow(0 4px 4px rgba(74, 60, 49, 0.15)); }

    @keyframes bgFade {
      0%, 13.75% { opacity: 0.2; }
      26.25%, 60% { opacity: 0.1; }
      72.5%, 100% { opacity: 0.2; }
    }
    
    @keyframes fabRect {
      0%, 13.75% { x: 144px; width: 52px; }
      26.25%, 60% { x: 40px; width: 260px; }
      72.5%, 100% { x: 144px; width: 52px; }
    }
    
    @keyframes fabInnerPos {
      0%, 13.75% { transform: translate(152px, 172px); } 
      26.25%, 60% { transform: translate(46px, 172px); }
      72.5%, 100% { transform: translate(152px, 172px); }
    }
    
    @keyframes contentFade {
      0%, 17.5% { opacity: 0; }
      30%, 60% { opacity: 1; }
      72.5%, 100% { opacity: 0; }
    }
    
    @keyframes mascotDefault {
      0%, 10% { opacity: 1; transform: scale(1); }
      22.5%, 60% { opacity: 0; transform: scale(1.1); }
      72.5%, 100% { opacity: 1; transform: scale(1); }
    }
    
    @keyframes mascotCurious {
      0%, 10% { opacity: 0; transform: scale(0.9); }
      22.5%, 60% { opacity: 1; transform: scale(1.1); }
      72.5%, 100% { opacity: 0; transform: scale(0.9); }
    }
    
    @keyframes moveCursor {
      0%, 10% { transform: translate(136px, 40px) scale(1); }
      26.25%, 60% { transform: translate(177px, 195px) scale(0.95); }
      72.5%, 100% { transform: translate(136px, 40px) scale(1); }
    }
    
    @keyframes pingAnim {
      0%, 25% { opacity: 0; transform: scale(0.2); }
      26% { opacity: 0.4; transform: scale(0.2); }
      40% { opacity: 0; transform: scale(2); }
      100% { opacity: 0; transform: scale(2); }
    }
    /* ]]> */
  </style>

  <defs>
    <clipPath id="text-clip">
      <rect x="0" y="0" width="162" height="36" />
    </clipPath>
  </defs>

  <!-- Outer Container -->
  <rect width="340" height="240" rx="24" class="wrapper-bg" />
  
  <!-- Faint App Background (animated opacity) -->
  <g class="bg-fade">
    <!-- Sidebar -->
    <path d="M 96 0 L 96 240" class="skel-divider" />
    <rect x="16" y="16" width="64" height="16" rx="4" class="skel-dark" />
    <rect x="16" y="44" width="48" height="8" rx="4" class="skel-light" />
    <rect x="16" y="60" width="56" height="8" rx="4" class="skel-light" />
    <rect x="16" y="76" width="40" height="8" rx="4" class="skel-light" />
    
    <!-- Main Content -->
    <rect x="112" y="16" width="76" height="24" rx="4" class="skel-dark" />
    
    <!-- Grid -->
    <rect x="112" y="56" width="98" height="64" rx="8" class="skel-light" />
    <rect x="222" y="56" width="98" height="64" rx="8" class="skel-light" />
    <rect x="112" y="132" width="98" height="64" rx="8" class="skel-light" />
    <rect x="222" y="132" width="98" height="64" rx="8" class="skel-light" />
  </g>
  
  <!-- FAB background with dynamic width -->
  <rect class="fab-bg" y="164" height="52" rx="16" />
  
  <!-- FAB contents (Mascot + Text) that moves via translate -->
  <g class="fab-inner">
