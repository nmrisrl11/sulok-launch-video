        </svg>
      </g>
    </g>
  </g>
  
  <!-- Animated Cursor and Ping -->
  <g class="cursor-anim">
    <!-- Ping effect circle - aligned exactly to tip (3.33, 3.33 for 20x20 cursor scaled from 24x24 tip at 4,4) -->
    <circle cx="3.5" cy="3.5" r="8" class="ping-circle" />
    
    <!-- MousePointer2 Icon -->
    <svg width="20" height="20" viewBox="0 0 24 24">
      <path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z" class="icon-cursor" />
    </svg>
  </g>
</svg>
