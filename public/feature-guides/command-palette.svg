<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 288" width="340" height="288">
  <defs>
    <style>
      /* <![CDATA[ */
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Manrope:wght@200..800&display=swap');

      :root {
        /* Sepia Theme */
        --background: #f4ecd8;
        --foreground: #4a3c31;
        --card: #f9f3e5;
        --card-foreground: #4a3c31;
        --popover: #f9f3e5;
        --popover-foreground: #4a3c31;
        --muted: #e8dfca;
        --muted-foreground: #7c6f64;
        --border: #dbcdb0;
        --primary: #4a3c31;
        --primary-foreground: #f4ecd8;
        --font-sans: "Manrope", sans-serif;
        --font-heading: "Fraunces", serif;
      }
      
      text { font-family: var(--font-sans); }
      .font-mono { font-family: monospace; }
      
      .wrapper-bg { fill: var(--muted); fill-opacity: 0.2; stroke: var(--border); stroke-opacity: 0.6; stroke-width: 1; }
      
      .fill-foreground { fill: var(--foreground); color: var(--foreground); }
      .fill-muted-foreground { fill: var(--muted-foreground); color: var(--muted-foreground); }
      .fill-background { fill: var(--background); color: var(--background); }
      .fill-card { fill: var(--card); color: var(--card); }
      .fill-popover { fill: var(--popover); color: var(--popover); }
      .fill-muted { fill: var(--muted); color: var(--muted); }
      
      .text-foreground { fill: var(--foreground); color: var(--foreground); }
      .text-muted-foreground { fill: var(--muted-foreground); color: var(--muted-foreground); }
      
      .stroke-foreground { stroke: var(--foreground); fill: none; }
      .stroke-muted-foreground { stroke: var(--muted-foreground); fill: none; }
      .stroke-border { stroke: var(--border); fill: none; }

      .opacity-0 { opacity: 0; }
      .opacity-100 { opacity: 1; }
      .opacity-50 { opacity: 0.5; }

      /* Animations */
      .outer-group { 
        animation: outerTransform 6s infinite; 
      }
      .shadow-layer {
        filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.12));
      }
      .shadow-rect {
        fill: var(--popover);
        animation: outerHeight 6s infinite;
      }
      .palette-container { 
        animation: paletteFocus 6s infinite cubic-bezier(0.2, 0.8, 0.2, 1), outerHeight 6s infinite; 
      }
      .inner-box { animation: innerHeight 6s infinite; }
      .clip-box { animation: clipHeight 6s infinite; }
      
      .placeholder-text { animation: placeholderFade 6s infinite; }
      .cursor-caret { animation: caretBlink 6s infinite; }
      
      /* Typed text steps */
      .type-1 { animation: type1 6s infinite; }
      .type-2 { animation: type2 6s infinite; }
      .type-3 { animation: type3 6s infinite; }
      .type-4 { animation: type4 6s infinite; }
      .type-5 { animation: type5 6s infinite; }
      .type-6 { animation: type6 6s infinite; }
      
      /* Folder visibility */
      .item-dev { animation: itemDev 6s infinite; }
      .item-design { animation: itemDesign 6s infinite; }
      .item-personal { animation: itemPersonal 6s infinite; }
      .item-travel { animation: itemTravel 6s infinite; }
      
      .linksLabel { animation: linksLabel 6s infinite; }
      
      /* Highlight text match */
      .highlight-travel { animation: highlightTravel 6s infinite; }
      .unhighlight-travel { animation: unhighlightTravel 6s infinite; }
      
      /* Item Hover */
      .hover-travel { animation: hoverTravel 6s infinite; }
      
      /* Simulated Mouse Cursor */
      .mouse-cursor { animation: mouseCursor 6s infinite cubic-bezier(0.2, 0.8, 0.2, 1); }
      .mouse-ping { animation: mousePing 6s infinite cubic-bezier(0, 0, 0.2, 1); transform-origin: 4px 4px; }

      /* Keyframes */
      @keyframes outerTransform {
        0%, 27% { transform: translate(40px, 30px); }
        27.1%, 29% { transform: translate(40px, 60px); }
        29.1%, 75% { transform: translate(40px, 75px); }
        75.1%, 100% { transform: translate(40px, 30px); }
      }
      @keyframes outerHeight {
        0%, 27% { height: 228px; }
        27.1%, 29% { height: 168px; }
        29.1%, 75% { height: 138px; }
        75.1%, 100% { height: 228px; }
      }
      @keyframes innerHeight {
        0%, 27% { height: 172px; }
        27.1%, 29% { height: 112px; }
        29.1%, 75% { height: 82px; }
        75.1%, 100% { height: 172px; }
      }
      @keyframes clipHeight {
        0%, 27% { height: 172px; }
        27.1%, 29% { height: 112px; }
        29.1%, 75% { height: 82px; }
        75.1%, 100% { height: 172px; }
      }
      
      @keyframes paletteFocus {
        0%, 15% { stroke: var(--border); }
        15.1%, 75% { stroke: rgba(74, 60, 49, 0.3); }
        75.1%, 100% { stroke: var(--border); }
      }
      
      @keyframes placeholderFade {
        0%, 15% { opacity: 1; }
        15.1%, 75% { opacity: 0; }
        75.1%, 100% { opacity: 1; }
      }
      
      @keyframes caretBlink {
        0%, 15% { opacity: 0; transform: translateX(0); }
        15.1%, 18% { opacity: 1; transform: translateX(0); }
        18.1%, 21% { opacity: 0; transform: translateX(0); }
        21.1%, 25% { opacity: 1; transform: translateX(0); }
        25.1%, 27% { opacity: 0; transform: translateX(0); }
        27.1%, 29% { opacity: 1; transform: translateX(8px); }
        29.1%, 31% { opacity: 1; transform: translateX(12px); }
        31.1%, 33% { opacity: 1; transform: translateX(18px); }
        33.1%, 35% { opacity: 1; transform: translateX(24px); }
        35.1%, 37% { opacity: 1; transform: translateX(31px); }
        37.1%, 75% { opacity: 1; transform: translateX(34px); }
        75.1%, 100% { opacity: 0; transform: translateX(0); }
      }

      /* T - r - a - v - e - l */
      @keyframes type1 { 0%, 27% { opacity: 0; } 27.1%, 75% { opacity: 1; } 75.1%, 100% { opacity: 0; } }
      @keyframes type2 { 0%, 29% { opacity: 0; } 29.1%, 75% { opacity: 1; } 75.1%, 100% { opacity: 0; } }
      @keyframes type3 { 0%, 31% { opacity: 0; } 31.1%, 75% { opacity: 1; } 75.1%, 100% { opacity: 0; } }
      @keyframes type4 { 0%, 33% { opacity: 0; } 33.1%, 75% { opacity: 1; } 75.1%, 100% { opacity: 0; } }
      @keyframes type5 { 0%, 35% { opacity: 0; } 35.1%, 75% { opacity: 1; } 75.1%, 100% { opacity: 0; } }
      @keyframes type6 { 0%, 37% { opacity: 0; } 37.1%, 75% { opacity: 1; } 75.1%, 100% { opacity: 0; } }

      /* Item Visibility based on filter */
      @keyframes itemDev {
        0%, 29% { opacity: 1; }
        29.1%, 75% { opacity: 0; pointer-events: none; }
        75.1%, 100% { opacity: 1; pointer-events: auto; }
      }
      @keyframes itemDesign {
        0%, 27% { opacity: 1; }
        27.1%, 75% { opacity: 0; pointer-events: none; }
        75.1%, 100% { opacity: 1; pointer-events: auto; }
      }
      @keyframes itemPersonal {
        0%, 27% { opacity: 1; }
        27.1%, 75% { opacity: 0; pointer-events: none; }
        75.1%, 100% { opacity: 1; pointer-events: auto; }
      }
      @keyframes itemTravel {
        0%, 27% { opacity: 1; transform: translateY(90px); }
        27.1%, 29% { opacity: 1; transform: translateY(30px); }
        29.1%, 75% { opacity: 1; transform: translateY(0px); }
        75.1%, 100% { opacity: 1; transform: translateY(90px); }
      }
      
      @keyframes linksLabel {
        0%, 27% { transform: translateY(0); }
        27.1%, 29% { transform: translateY(-60px); }
        29.1%, 75% { transform: translateY(-90px); }
        75.1%, 100% { transform: translateY(0); }
      }

      /* Highlight text match */
      @keyframes highlightTravel {
        0%, 27% { font-weight: normal; }
        27.1%, 75% { font-weight: bold; }
        75.1%, 100% { font-weight: normal; }
      }
      @keyframes unhighlightTravel {
        0%, 27% { opacity: 1; }
        27.1%, 75% { opacity: 0; }
        75.1%, 100% { opacity: 1; }
      }

      /* Hover states */
      @keyframes hoverTravel {
        0%, 48% { fill: transparent; }
        48.1%, 75% { fill: var(--muted); }
        75.1%, 100% { fill: transparent; }
      }
      
      @keyframes mouseCursor {
        0%, 5% { transform: translate(260px, 260px) scale(1); opacity: 0; }
        10%, 15% { transform: translate(100px, 52px) scale(1); opacity: 1; }
        15%, 18% { transform: translate(100px, 52px) scale(0.95); opacity: 1; }
        20%, 45% { transform: translate(280px, 160px) scale(1); opacity: 1; }
        50%, 55% { transform: translate(120px, 160px) scale(1); opacity: 1; }
        55%, 58% { transform: translate(120px, 160px) scale(0.95); opacity: 1; }
        60%, 75% { transform: translate(260px, 260px) scale(1); opacity: 0; }
        100% { transform: translate(260px, 260px) scale(1); opacity: 0; }
      }
      
      @keyframes mousePing {
        0%, 15% { transform: scale(1); opacity: 0; }
        15.1% { transform: scale(1); opacity: 0.4; }
        20%, 55% { transform: scale(2); opacity: 0; }
        55.1% { transform: scale(1); opacity: 0.4; }
        60%, 100% { transform: scale(2); opacity: 0; }
      }
      /* ]]> */
    </style>
    
    <clipPath id="results-clip">
      <rect width="236" height="172" rx="12" class="clip-box" />
    </clipPath>

    <svg id="search-icon" viewBox="0 0 24 24">
      <path d="m21 21-4.34-4.34" stroke="inherit" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="11" cy="11" r="8" stroke="inherit" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    
    <svg id="folder-icon" viewBox="0 0 64 64">
      <path d="m59.61 10.69h-29.43c-1.2 0-2.35-.49-3.18-1.36l-3.76-3.94c-.83-.87-1.98-1.36-3.18-1.36h-15.67c-2.43 0-4.39 1.96-4.39 4.38v41.88c0 2.42 1.96 4.39 4.39 4.39h55.22c2.42 0 4.39-1.96 4.39-4.39v-35.21c0-2.42-1.96-4.39-4.39-4.39z" fill="var(--folder-color-back, #56b2e3)" />
      <path d="m57.26 15.07h-50.52c-1.83 0-3.32 1.49-3.32 3.32v33.48c0 1.84 1.49 3.32 3.32 3.32h50.52c1.83 0 3.32-1.49 3.32-3.32v-33.47c0-1.84-1.48-3.33-3.32-3.33z" fill="var(--folder-color-paper, #ffffff)" />
      <path d="m59.61 20.42h-55.22c-2.43 0-4.39 1.96-4.39 4.39v30.78c0 2.42 1.96 4.39 4.39 4.39h55.22c2.42 0 4.39-1.96 4.39-4.39v-30.78c0-2.43-1.96-4.39-4.39-4.39z" fill="var(--folder-color-front, #98cfef)" />
    </svg>
    
    <svg id="mouse-pointer" viewBox="0 0 24 24">
      <path fill="var(--foreground)" stroke="var(--foreground)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z" />
    </svg>
  </defs>
  
  <rect width="340" height="288" rx="16" class="wrapper-bg" />

  <!-- Command Palette -->
  <g class="outer-group" transform="translate(40, 30)">
    <!-- Dedicated shadow layer to bypass WebKit filter rendering bugs -->
    <g class="shadow-layer">
      <rect width="260" height="228" rx="16" class="shadow-rect" />
    </g>
    
    <rect width="260" height="228" rx="16" class="fill-popover palette-container stroke-border" stroke-width="1" />
    
    <!-- Search Input -->
    <g transform="translate(12, 12)">
      <use href="#search-icon" x="8" y="8" width="16" height="16" class="stroke-foreground opacity-50" />
      
      <!-- Placeholder -->
      <text x="32" y="21" class="placeholder-text text-muted-foreground" style="font-size: 13px;">Search your corner...</text>
      
      <!-- Typed Text -->
      <text x="32" y="21" class="text-foreground" style="font-size: 13px;"><tspan class="type-1">T</tspan><tspan class="type-2">r</tspan><tspan class="type-3">a</tspan><tspan class="type-4">v</tspan><tspan class="type-5">e</tspan><tspan class="type-6">l</tspan></text>
      
      <!-- Caret -->
      <rect x="32" y="9" width="1" height="14" class="fill-foreground cursor-caret" />
    </g>
    
    <!-- Results Box -->
    <g transform="translate(12, 44)">
      <!-- bg-background ring-border -->
      <rect width="236" height="172" rx="12" fill="var(--background)" stroke="var(--border)" stroke-width="1" class="inner-box" />
      
      <!-- Use clipPath so folders disappear when moving up past the rounded bounds -->
      <g clip-path="url(#results-clip)">
        <text x="12" y="18" class="text-[10px] font-medium text-muted-foreground" style="font-size: 10px;">Folders</text>
        
        <!-- Folders Container -->
        <g transform="translate(6, 26)">
          
          <!-- Folder 1: Development -->
          <g class="item-dev">
            <rect width="224" height="30" rx="6" fill="transparent" />
            <use href="#folder-icon" x="8" y="8" width="14" height="14" style="--folder-color-back: #3b82f6; --folder-color-paper: #ffffff; --folder-color-front: #93c5fd" />
            <text x="28" y="19" class="text-foreground" style="font-size: 13px;">Development</text>
          </g>
          
          <!-- Folder 2: Design Inspiration -->
          <g class="item-design" transform="translate(0, 30)">
            <rect width="224" height="30" rx="6" fill="transparent" />
            <use href="#folder-icon" x="8" y="8" width="14" height="14" style="--folder-color-back: #3b82f6; --folder-color-paper: #ffffff; --folder-color-front: #93c5fd" />
            <text x="28" y="19" class="text-foreground" style="font-size: 13px;">Design Inspiration</text>
          </g>
          
          <!-- Folder 3: Personal Projects -->
          <g class="item-personal" transform="translate(0, 60)">
            <rect width="224" height="30" rx="6" fill="transparent" />
            <use href="#folder-icon" x="8" y="8" width="14" height="14" style="--folder-color-back: #3b82f6; --folder-color-paper: #ffffff; --folder-color-front: #93c5fd" />
            <text x="28" y="19" class="text-foreground" style="font-size: 13px;">Personal Projects</text>
          </g>
          
          <!-- Folder 4: Travel Plans -->
          <g class="item-travel">
            <rect width="224" height="30" rx="6" class="hover-travel" />
            <use href="#folder-icon" x="8" y="8" width="14" height="14" style="--folder-color-back: #3b82f6; --folder-color-paper: #ffffff; --folder-color-front: #93c5fd" />
            
            <text x="28" y="19" class="text-foreground unhighlight-travel" style="font-size: 13px;">Travel Plans</text>
            
            <!-- Highlighted Text version -->
            <text x="28" y="19" class="text-foreground type-1" style="font-size: 13px;"><tspan class="highlight-travel">Travel</tspan> Plans</text>
          </g>
        </g>
        
        <!-- Links Header - Animated to slide up with folders -->
        <text x="12" y="162" class="font-medium text-muted-foreground opacity-50 linksLabel" style="font-size: 10px;">Links</text>
      </g>
    </g>
  </g>

  <!-- Fake Cursor -->
  <g class="mouse-cursor">
    <circle cx="4" cy="4" r="8" class="mouse-ping" fill="rgba(74, 60, 49, 0.4)" />
    <use href="#mouse-pointer" x="0" y="0" width="20" height="20" />
  </g>
</svg>
